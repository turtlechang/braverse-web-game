name: Deployment Browser Validation

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Vercel Preview or Production URL
        required: true
        type: string
      deployment_label:
        description: Acceptance environment label
        required: true
        default: Preview
        type: choice
        options:
          - Preview
          - Production

permissions:
  contents: read

concurrency:
  group: deployment-browser-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment-browser-validation:
    name: Preview / Production Browser acceptance
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Preview' ||
      github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: trust
        name: Determine trusted validation path
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "deployment_status" && "${DEPLOYMENT_ENVIRONMENT}" == "Production" ]]; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should-run=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping Preview deployment from a non-default ref; run Preview acceptance manually from the default branch."
          fi
      - uses: actions/checkout@v5
        if: steps.trust.outputs.should-run == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare deployment artifacts
        if: steps.trust.outputs.should-run == 'true'
        shell: bash
        run: mkdir -p test-results/deployment-browser
      - name: Verify trusted deployment smoke harness
        if: steps.trust.outputs.should-run == 'true'
        shell: bash
        run: |
          if [[ ! -f scripts/deployment-browser-validation.mjs ]]; then
            echo "Trusted default branch is missing scripts/deployment-browser-validation.mjs."
            echo "Merge the deployment smoke harness into the default branch before running this workflow."
            exit 1
          fi

          if ! node -e "const pkg = require('./package.json'); if (typeof pkg.scripts?.['test:deployment:browser'] !== 'string') process.exit(1)"; then
            echo "Trusted default branch is missing the test:deployment:browser npm script."
            echo "Merge the deployment smoke harness into the default branch before running this workflow."
            exit 1
          fi
      - uses: actions/setup-node@v5
        if: steps.trust.outputs.should-run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.trust.outputs.should-run == 'true'
      - run: npx playwright install chromium --with-deps
        if: steps.trust.outputs.should-run == 'true'
      - name: Run deployed-site smoke
        if: steps.trust.outputs.should-run == 'true'
        env:
          BRAVERSE_DEPLOYMENT_URL: ${{ inputs.deployment_url || github.event.deployment_status.environment_url }}
          BRAVERSE_DEPLOYMENT_LABEL: ${{ inputs.deployment_label || github.event.deployment.environment }}
          BRAVERSE_WS_URL: wss://braverse-web-game.onrender.com
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:deployment:browser
      - uses: actions/upload-artifact@v5
        if: always() && steps.trust.outputs.should-run == 'true'
        with:
          name: deployment-browser-${{ github.run_id }}
          path: test-results/deployment-browser/
          if-no-files-found: warn
          retention-days: 14
