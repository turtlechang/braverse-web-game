name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:cards
      - run: npm run validate:candidate
      - run: npm run check:card-pool
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-benchmark-issue-bundles
          path: test-results/ai-benchmark
          if-no-files-found: ignore
